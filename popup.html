<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 180px;
      padding: 12px;
      margin: 0;
      text-align: center;
      background-color: #ffffff;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #333;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 22px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0056b3;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .status-text {
      margin-top: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #666;
    }
  </style>
</head>
<body>
  <h3>IS MUNI Stats</h3>
  <label class="switch">
    <input type="checkbox" id="toggle-switch">
    <span class="slider"></span>
  </label>
  <div class="status-text" id="status-label">Enabled</div>
  <script src="popup.js"></script>
</body>
</html>
